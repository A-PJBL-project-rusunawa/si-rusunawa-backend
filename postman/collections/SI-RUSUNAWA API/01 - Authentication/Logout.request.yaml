$kind: http-request
url: "{{base_url}}/api/logout"
method: POST
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code >= 200 && pm.response.code < 300) {
          pm.collectionVariables.unset('token');
          console.log('Token berhasil dihapus.');
      }
    language: text/javascript
order: 3000
